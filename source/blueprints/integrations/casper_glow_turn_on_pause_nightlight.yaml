blueprint:
  name: "Turn on Casper Glow and pause at nightlight level"
  description: "Turns on the Casper Glow at a set time, then pauses the dimming sequence when a specified number of minutes remain, holding the light at a dim nightlight level."
  domain: automation
  input:
    bedtime:
      name: Turn-on time
      selector:
        time:
    glow_device:
      name: Casper Glow
      selector:
        device:
          filter:
            - integration: casper_glow
    dimming_minutes:
      name: Dimming duration
      default: "15"
      selector:
        select:
          options:
            - "15"
            - "30"
            - "45"
            - "60"
            - "90"
    pause_at_remaining:
      name: Pause when this many minutes remain
      default: 10
      selector:
        number:
          min: 1
          max: 89
          unit_of_measurement: min
mode: restart
variables:
  glow_device: !input glow_device
  dimming_minutes: !input dimming_minutes
  pause_at_remaining: !input pause_at_remaining
  light_entity: >
    {{ device_entities(glow_device) | select('match', 'light\\..*') | first }}
  select_entity: >
    {{ device_entities(glow_device) | select('match', 'select\\..*') | first }}
  sensor_entity: >
    {{ expand(device_entities(glow_device))
       | selectattr('domain', 'eq', 'sensor')
       | selectattr('attributes.device_class', 'eq', 'duration')
       | map(attribute='entity_id')
       | first }}
triggers:
  - trigger: time
    at: !input bedtime
actions:
  - action: select.select_option
    target:
      entity_id: "{{ select_entity }}"
    data:
      option: !input dimming_minutes
  - action: light.turn_on
    target:
      entity_id: "{{ light_entity }}"
  - wait_for_trigger:
      - trigger: template
        value_template: >-
          {{ states(sensor_entity) | int(default=10) < pause_at_remaining | int }}
    timeout:
      minutes: "{{ dimming_minutes | int }}"
    continue_on_timeout: false
  - action: casper_glow.pause
    target:
      entity_id: "{{ light_entity }}"
